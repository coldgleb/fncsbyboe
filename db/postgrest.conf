# PostgREST для сайта: каждая функция схемы api становится эндпоинтом
#   GET /rpc/season_summary?p_season=2026&p_division=open
# Запуск на сервере с базой:  postgrest db/postgrest.conf
#
# Пароль сюда не кладём: подставь его в db-uri на сервере
# (или задай переменной окружения PGRST_DB_URI — она важнее файла).

db-uri = "postgres://fncsuser:ПАРОЛЬ@localhost:37526/fncsbyboe"

# сайт видит только схему api; анонимный вызов — под ролью web_anon (только EXECUTE)
db-schemas = "api"
db-anon-role = "web_anon"

# снаружи — только чтение, все функции STABLE
db-tx-end = "rollback-allow-override"

# наружу — только через HTTPS-прокси Caddy: db.sgl813.ru { reverse_proxy 127.0.0.1:3000 }
server-host = "127.0.0.1"
server-port = 3000

# сайт открыт на другом домене — список разрешённых источников через запятую ("*" PostgREST 12 не понимает)
server-cors-allowed-origins = "https://fncsbyboe.vercel.app, https://fncsbyboe-postgres.vercel.app"

# ответы крупных функций не режем по времени сервера
db-pool = 10
db-pool-acquisition-timeout = 10
