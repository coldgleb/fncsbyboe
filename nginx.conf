server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html и справка — всегда свежие; скрипты и стили версионируются через ?v=
    location = /index.html     { add_header Cache-Control "no-cache"; }
    location = /calc-help.html { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css|svg)$ { add_header Cache-Control "public, max-age=604800"; }
}
